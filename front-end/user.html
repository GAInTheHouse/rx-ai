<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <header class="header">
            Medical System
        </header>
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#">Dashboard</a></li>
                    <li><a href="#">My Profile</a></li>
                    <li><a href="#">Messages</a></li>
                    <li><a href="#">Medical Records</a></li>
                    <li><a href="#">Documents</a></li>
                    <li class="active"><a href="#">Lab Results</a></li>
                    <li><a href="#">Payments</a></li>
                    <li><a href="#">Calendar</a></li>
                    <li><a href="#">Resources</a></li>
                    <li><a href="#">FAQ</a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <h1 id="user-id-title"></h1>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Todo ID</th>
                        <th>Title</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="todo-list-body">
                </tbody>
            </table>

            <form id="add-todo-form">
                <h2>Add New Todo</h2>
                <input type="text" id="todo-title" placeholder="Enter new todo title" required>
                <button type="submit">Add Todo</button>
            </form>
            <a href="index.html" id="back-link">Back to User List</a>
        </main>
    </div>
    <script src="userDetail.js"></script>
</body>

</html>
